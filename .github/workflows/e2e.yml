name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL aplikasi yang diuji"
        required: false
        default: "https://rehat-staging.vercel.app"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (Chromium, Firefox, WebKit, mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Pastikan kredensial E2E tersedia
        env:
          E2E_PATIENT_EMAIL: ${{ secrets.E2E_PATIENT_EMAIL }}
        run: |
          if [ -z "$E2E_PATIENT_EMAIL" ]; then
            echo "Secrets E2E_* belum diset di repository ini."
            exit 1
          fi

      - name: Jalankan E2E
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_PATIENT_EMAIL: ${{ secrets.E2E_PATIENT_EMAIL }}
          E2E_PATIENT_PASSWORD: ${{ secrets.E2E_PATIENT_PASSWORD }}
          E2E_COUNSELOR_EMAIL: ${{ secrets.E2E_COUNSELOR_EMAIL }}
          E2E_COUNSELOR_PASSWORD: ${{ secrets.E2E_COUNSELOR_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: bun run test:e2e

      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
