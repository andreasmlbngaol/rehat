name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rehat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rehat_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rehat_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BOOKING_PAYMENT_TTL_MINUTES: "60"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      MIDTRANS_SERVER_KEY: test-midtrans-server-key
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: test-midtrans-client-key
      MIDTRANS_IS_PRODUCTION: "false"
      ZOOM_ACCOUNT_ID: test-zoom-account
      ZOOM_CLIENT_ID: test-zoom-client
      ZOOM_CLIENT_SECRET: test-zoom-secret
      RESEND_API_KEY: re_test
      RESEND_FROM_EMAIL: "REHAT <no-reply@example.com>"
      R2_ACCOUNT_ID: test-r2-account
      R2_ACCESS_KEY_ID: test-r2-access-key
      R2_SECRET_ACCESS_KEY: test-r2-secret-key
      R2_BUCKET_NAME: rehat-test
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_PUBLIC_URL: https://cdn.example.com
      CRON_SECRET: test-cron-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Apply migrations to test database
        run: bun run test:db:setup

      - name: Unit, API, and integration tests
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
