services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      # Hasil `prisma generate` di container tidak boleh menimpa berkas host
      # dengan pemilik root.
      - /app/lib/generated/prisma
    command: ["sh", "-c", "bun run db:generate && bun run dev --hostname 0.0.0.0 --webpack"]
